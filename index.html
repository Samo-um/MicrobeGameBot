<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MICROBE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;color:#fff;min-height:100vh;background:linear-gradient(180deg,#3b0a54,#7b1e8a 35%,#0e6b4a 75%,#062a1e)}
button{border:0;cursor:pointer}button:active{transform:scale(.92)}
.w{max-width:480px;margin:auto;padding:12px 12px 110px}
.top{display:flex;justify-content:space-between;background:rgba(0,0,0,.4);border-radius:16px;padding:11px}
.bal span{background:#000;border:2px solid #fff;border-radius:99px;padding:6px 8px;font-size:12px;font-weight:900}
.bal i{font-style:normal;color:#FFD700}
.snd{width:100%;margin-top:10px;padding:13px;border-radius:14px;background:#000;color:#fff;font-weight:900;border:3px solid #FFD700}
.pg{display:none}.pg.on{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}
.tile{min-height:126px;border-radius:22px;padding:14px;text-align:left;color:#fff;border:2px solid #fff}
.tile b{display:block;font-size:16px;margin-top:8px}.tile span{font-size:11px}
.tile .ic{font-size:42px;display:block}
.a{background:linear-gradient(135deg,#ff8ac2,#c026d3)}.b{background:linear-gradient(135deg,#ffb800,#ff5a00)}.c{background:linear-gradient(135deg,#8b5cf6,#3b0764)}.d{background:linear-gradient(135deg,#38bdf8,#1e3a8a)}.e{background:linear-gradient(135deg,#22c55e,#052e16)}.f{background:linear-gradient(135deg,#facc15,#713f12)}
.card{background:#fff;color:#111;border-radius:22px;padding:16px;margin-top:12px}
.btn{width:100%;padding:15px;border-radius:16px;font-weight:900;margin-top:10px}
.y{background:#FFE600}.g{background:#22C55E;color:#fff}.k{background:#111;color:#fff}
input{width:100%;padding:13px;border-radius:13px;border:2px solid #111;margin-top:8px;font-weight:800}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:999;display:flex;gap:5px;padding:9px 8px 14px;background:#000;border-top:3px solid #FFD700}
.nav button{flex:1;background:#222;color:#fff;border-radius:14px;padding:10px 2px;font-size:10px;font-weight:900;min-height:60px}
.nav button.on{background:#FFD700;color:#000}
.nav i{display:block;font-size:24px;font-style:normal}
</style>
</head>
<body>
<div class="w">
<div class="top"><b>🦠 MICROBE</b><div class="bal"><span>🦠 <i id="mp">0.0000</i></span><span>⭐ <i id="st">0</i></span></div></div>
<button class="snd" id="sb" onclick="sndT()">🔇 ЗВУК ВЫКЛЮЧЕН — НАЖМИ МЕНЯ</button>
<div id="v"></div>
<nav class="nav">
<button class="on" onclick="go('home',this)"><i>🏠</i>Главная</button>
<button onclick="go('tasks',this)"><i>🎁</i>Задания</button>
<button onclick="go('games',this)"><i>🎮</i>Игры</button>
<button onclick="go('shop',this)"><i>🛒</i>Магазин</button>
<button onclick="go('hist',this)"><i>📜</i>История</button>
</nav>
</div>
<script>
var mp=0,stars=0,tok=0,wins=0,inv=[],hist=[];
try{var o=JSON.parse(localStorage.getItem('mb1')||'null');if(o){mp=o.mp||0;stars=o.stars||0;tok=o.tok||0;inv=o.inv||[];hist=o.hist||[]}}catch(e){}
var sound=false,AC=null;
function fmt(n){return Number(n).toFixed(4)}
function save(){localStorage.setItem('mb1',JSON.stringify({mp:mp,stars:stars,tok:tok,inv:inv,hist:hist}))}
function beep(f){if(!sound)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.15)}catch(e){}}
function sndT(){sound=!sound;document.getElementById('sb').textContent=sound?'🔊 ЗВУК ВКЛЮЧЁН!':'🔇 ЗВУК ВЫКЛЮЧЕН — НАЖМИ МЕНЯ';if(sound)beep(800)}
function toast(t){alert(t)}
function upd(){document.getElementById('mp').textContent=fmt(mp);document.getElementById('st').textContent=stars;save()}
function homeHTML(){
return '<div style="text-align:center;padding:16px 4px"><div style="font-size:88px">🦠</div><h1 style="font-size:36px">MICROBE 🦠</h1><p>Уровень 1 • Всё 0 • Онлайн: 1 — ты один</p><button class="btn y" onclick="tap()">🦠 ТКНУТЬ +0.0001 MP</button></div>'
+'<div class="card"><h2>🎁 Старт с нуля</h2><button class="btn y" onclick="openCase()">🎁 БЕСПЛАТНЫЙ КЕЙС</button><button class="btn g" onclick="daily()">🎁 БОНУС +1000 🪙 = +0.1000 MP</button></div>'
+'<div class="grid">'
+'<button class="tile a" onclick="go(\'inv\')"><span class="ic">🧰</span><b>ИНВЕНТАРЬ</b><span>CANDY CANE 427 ⭐</span></button>'
+'<button class="tile b" onclick="go(\'contest\')"><span class="ic">🏆</span><b>КОНКУРСЫ</b><span>1000 NFT</span></button>'
+'<button class="tile c" onclick="go(\'games\')"><span class="ic">🎮</span><b>ИГРЫ</b><span>Все игры</span></button>'
+'<button class="tile d" onclick="go(\'crash\')"><span class="ic">🚀</span><b>CRASH</b><span>Ставка x X</span></button>'
+'<button class="tile e" onclick="go(\'tasks\')"><span class="ic">✅</span><b>ЗАДАНИЯ</b><span>+20,000 🪙</span></button>'
+'<button class="tile f" onclick="go(\'shop\')"><span class="ic">🛒</span><b>МАГАЗИН</b><span>Stars • GRAM</span></button></div>';
}
function go(id,btn){
beep(700);
var navs=document.querySelectorAll('.nav button');
for(var i=0;i<navs.length;i++)navs[i].classList.remove('on');
if(btn)btn.classList.add('on');
var v=document.getElementById('v');
if(id==='home'){v.innerHTML=homeHTML()}
if(id==='inv'){v.innerHTML='<div class="card"><h2>🧰 ИНВЕНТАРЬ — открылось!</h2><p>'+(inv.length?inv.join('<br>'):'Пусто — 0. Открой кейс.')+'</p><button class="btn y" onclick="openCase()">🎁 ОТКРЫТЬ КЕЙС</button></div><button class="btn k" onclick="go(\'home\')">⬅ НАЗАД</button>'}
if(id==='contest'){v.innerHTML='<div class="card"><h2>🏆 1000 NFT</h2><p>81,935 участников</p><button class="btn y" onclick="joinC()">УЧАСТВОВАТЬ +0.0010 MP</button></div><button class="btn k" onclick="go(\'home\')">⬅ НАЗАД</button>'}
if(id==='games'){v.innerHTML='<div class="card"><h2>🎮 ИГРЫ — открылось!</h2><button class="btn y" onclick="go(\'crash\')">🚀 CRASH</button><button class="btn g" onclick="playWin(2)">🎲 ИГРА x2 — выиграл 0.02 = получил 0.02</button></div><button class="btn k" onclick="go(\'home\')">⬅ НАЗАД</button>'}
if(id==='crash'){v.innerHTML='<div class="card" style="text-align:center"><h2>🚀 CRASH</h2><div style="font-size:44px;font-weight:900" id="cn">x1.00</div><input id="cb" type="number" value="0.01" step="0.0001"><button class="btn y" onclick="startC()">🚀 ЗАПУСТИТЬ</button><button class="btn g" onclick="cashC()">💰 ЗАБРАТЬ РОВНО СТОЛЬКО</button></div><button class="btn k" onclick="go(\'home\')">⬅ НАЗАД</button>'}
if(id==='tasks'){v.innerHTML='<div class="card" style="background:#B8F5C8"><h2>✅ ЗАДАНИЯ — открылось!</h2><p>Ежедневный бонус +1000 🪙</p><button class="btn g" onclick="daily()">ЗАБРАТЬ +1000 🪙</button><p>Пригласи друга +20000 🪙</p><button class="btn y" onclick="invite()">📋 ПРИГЛАСИТЬ +2.0000 MP</button></div><button class="btn k" onclick="go(\'home\')">⬅ НАЗАД</button>'}
if(id==='shop'){v.innerHTML='<div class="card"><h2>🛒 МАГАЗИН — открылось!</h2><p>MP: '+fmt(mp)+' • Stars: '+stars+' • Токены: '+tok+'</p><button class="btn y" onclick="demo()">ДЕМО +0.0500 MP</button><button class="btn g" onclick="buyS()">+100 ⭐ ДЕМО</button></div><button class="btn k" onclick="go(\'home\')">⬅ НАЗАД</button>'}
if(id==='hist'){v.innerHTML='<div class="card"><h2>📜 ИСТОРИЯ — открылось!</h2><p>'+(hist.length?hist.join('<br>'):'Пока пусто. Выиграй 7, тут будет +7.')+'</p></div><button class="btn k" onclick="go(\'home\')">⬅ НАЗАД</button>'}
window.scrollTo(0,0);upd();
}
function tap(){beep(900);mp=+(mp+0.0001).toFixed(4);tok++;hist.unshift('Тап +0.0001 MP');toast('🦠 +0.0001 MP! Было 0!');go('home')}
function openCase(){beep(800);var p=['🌹 Роза 5 ⭐','🐻 Мишка 10 ⭐','🍭 CANDY CANE 427 ⭐'][Math.floor(Math.random()*3)];inv.push(p);stars+=5;mp=+(mp+0.005).toFixed(4);hist.unshift('Кейс: '+p);toast('🎁 Выпало: '+p+' • +0.0050 MP');go('home')}
function daily(){beep(800);tok+=1000;mp=+(mp+0.1).toFixed(4);hist.unshift('Бонус +0.1000 MP');toast('🎁 +1000 🪙 = +0.1000 MP ровно!');go('home')}
function joinC(){mp=+(mp+0.001).toFixed(4);toast('✅ +0.0010 MP');upd()}
function invite(){tok+=20000;mp=+(mp+2).toFixed(4);toast('📋 +2.0000 MP за друга!');upd()}
function demo(){mp=+(mp+0.05).toFixed(4);tok+=500;toast('+0.0500 MP! Теперь Crash!');upd()}
function buyS(){stars+=100;toast('+100 ⭐');upd()}
function playWin(m){var bet=0.01;if(mp<bet){toast('Нужно 0.01 — нажми ДЕМО в магазине');go('shop');return}mp=+(mp-bet).toFixed(4);var amt=+(bet*m).toFixed(4);mp=+(mp+amt).toFixed(4);wins++;hist.unshift('Игра: '+bet+' x'+m+' = +'+fmt(amt)+' MP');toast('💰 Выиграл '+fmt(amt)+' MP — получил ровно '+fmt(amt)+'!');go('home')}
var crM=1,crOn=false,crT=null,crBet=0.01;
function startC(){crBet=parseFloat(document.getElementById('cb').value)||0.01;if(mp<crBet){toast('Нужно '+fmt(crBet)+' — ДЕМО в магазине');go('shop');return}mp=+(mp-crBet).toFixed(4);crM=1;crOn=true;beep(700);var boom=1+Math.random()*3;clearInterval(crT);crT=setInterval(function(){crM+=0.13;var e=document.getElementById('cn');if(e)e.textContent='x'+crM.toFixed(2);if(crM>=boom){clearInterval(crT);crOn=false;toast('💥 Взорвалось! Минус '+fmt(crBet))}},130);upd()}
function cashC(){if(!crOn){toast('Сначала запусти!');return}clearInterval(crT);crOn=false;var amt=+(crBet*crM).toFixed(4);mp=+(mp+amt).toFixed(4);hist.unshift('Crash: '+fmt(crBet)+' x'+crM.toFixed(2)+' = +'+fmt(amt)+' MP');toast('💰 +'+fmt(amt)+' MP — ровно столько, сколько выиграл!');go('home')}
if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand()}
go('home');
</script>
</body>
</html>
